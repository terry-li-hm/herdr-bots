name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only: CI only verifies; it never publishes, tags, or installs.
permissions:
  contents: read

jobs:
  # The implementation uses macOS-only filesystem primitives and launchd.
  check:
    name: make check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run the full deterministic gate
        run: make check
